# Deal scoring weights (must sum to 1.0)
weights:
  price: 0.35
  condition: 0.25
  seller: 0.20
  image: 0.10
  listing_quality: 0.10

# Alert thresholds
thresholds:
  hot_deal: 80
  good_deal: 60
  log_only: 40

# Price discount → score mapping
price_scores:
  - max_discount: 10
    score: 0
  - max_discount: 20
    score: 30
  - max_discount: 35
    score: 60
  - max_discount: 50
    score: 85
  - max_discount: 100
    score: 100

# Too-good-to-be-true guard. Past `threshold_pct` off, a listing is more likely
# a scam than a bargain: the price score stops climbing (capped) and the
# composite takes a penalty, so absurd discounts can no longer top the ranking.
suspicious_price:
  threshold_pct: 55
  max_price_score: 60
  penalty: -25

# Penalties from the AI's own findings (all negative, applied to the composite).
# Condition is already scored separately, so cosmetic flags are light; severe
# ones (locks, not working, cracks, water damage, "for parts") are heavy enough
# that a single one pushes an otherwise hot deal down a tier.
ai_signals:
  severe_flag_penalty: -20
  flag_penalty: -5
  flags_cap: -30
  hidden_defect_penalty: -8      # functional problem buried in the description
  hidden_defects_cap: -16
  not_good_deal_penalty: -10     # the model explicitly judged it not a deal
  visible_damage_penalty: -4     # damage visible in a real (non-stock) photo
  visible_damage_cap: -12
  total_cap: -40

# Stock photo scoring penalties
stock_photo_penalties:
  used_item_stock: -25
  new_item_stock: -10
  uncertain: -5

# Seller trust tiers
seller_tiers:
  high:
    min_sales: 100
    min_positive_pct: 98.0
    score: 95
  medium:
    min_sales: 50
    min_positive_pct: 95.0
    score: 70
  low_new:
    min_sales: 0
    min_positive_pct: 0.0
    score: 40
  low_bad:
    min_sales: 0
    max_positive_pct: 95.0
    score: 20
