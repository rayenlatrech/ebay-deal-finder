# General settings (all secrets come from environment variables)
ebay:
  marketplace: "EBAY_IT"
  buying_options: "FIXED_PRICE"
  results_per_page: 50
  max_pages_per_category: 2
  # Cross-border marketplaces searched in addition to the home one. Only
  # listings that ship to `ship_to_country` are returned, and — because
  # cross-border returns and disputes are far harder — a foreign listing is
  # dropped entirely unless its seller clears the `seller_trust` bar below.
  foreign_marketplaces:
    - EBAY_DE
    - EBAY_FR
    - EBAY_NL
    - EBAY_BE
  ship_to_country: "IT"

# "Trusted seller" definition — an established seller with a strong record.
# Used twice: as a hard gate on cross-border listings, and to split the
# Telegram summary into trusted vs. other sections.
seller_trust:
  min_positive_pct: 95.0
  min_sales: 10

ai:
  primary_provider: "gemini"
  fallback_provider: "groq"
  gemini_model: "gemini-2.5-flash"
  groq_model: "llama-3.3-70b-versatile"
  max_image_analyses_per_run: 20
  max_text_analyses_per_run: 50

scanning:
  min_discount_for_ai: 10
  min_discount_for_alert: 15
  # Product buckets that must never be alerted on. Regexes matched against the
  # classifier's product_key. They still feed baselines and the resale dataset —
  # this only stops them being surfaced as deals.
  excluded_product_patterns:
    # Galaxy A-series: only the A57 is of interest, every other A-model is out.
    # The lookahead must end on "_" or end-of-string — "\b" fails here because
    # regex counts "_" as a word character, so "a57_256gb" would be excluded.
    - '^galaxy_a(?!57(?:_|$))\d+'

# New-price ceiling. A used unit can't be worth its full new price, so the
# ceiling is scaled per condition band before being used as a baseline.
# Sources, in priority order: manually-curated reference_prices (true retail),
# then eBay's own NEW-condition baseline for the same bucket (free, automatic).
reference:
  used_factor: 0.75    # a used unit at 75% of new is "at market", not a deal
  new_factor: 1.00     # a sealed unit below retail IS a genuine deal
  # Fall back to eBay's own NEW-condition baseline when a model has no curated
  # retail price. These are third-party ASKING prices, not true retail — often
  # above it, occasionally below. Safe because the anchor only ever *lowers* a
  # baseline (it can suppress a deal, never invent one). Set false to rely
  # exclusively on the manually-curated reference_prices table.
  use_ebay_new_fallback: true

telegram:
  batch_good_deals: true
  send_scan_report: true

# Longitudinal sold-price tracking (builds the resale dataset over time).
tracking:
  enabled: true
  stale_hours: 24            # re-check a listing only after this long unseen
  max_reconcile_checks: 120  # cap getItem liveness checks per run (quota guard)
  max_track_days: 90         # stop tracking a listing after this long
  sold_max_days: 60          # ended within this window => proxy "sold"
  retention_days: 150        # keep raw sold_comps this long, then roll up + drop
  min_comps: 3               # min comps before a resale_stats bucket is trusted
  stats_refresh_hours: 20    # rebuild resale_stats at most this often
