name: eBay Deal Scanner

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # BACKUP only. Scans are started on time by an external cron (cron-job.org
    # calling workflow_dispatch at 00, 04, 08, 12, 16, 20 UTC), because GitHub's
    # own cron fires late and drops slots under load. This runs 30 min after
    # each slot and skips itself if a scan ran in the last 4h — a full interval,
    # because it has fired as much as 3.5h late (19:56 for the 16:30 slot) and
    # a shorter look-back let it double up with the next on-time scan.
    - cron: '30 */4 * * *'
  workflow_dispatch:
    # The external cron's trigger, and manual runs from the Actions UI

jobs:
  test:
    # Runs on every push/PR (and before any scheduled scan) to catch
    # regressions in the classification + baseline logic.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  scan:
    needs: test
    # Only actually scan on the schedule or a manual run — not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Five marketplace sweeps plus reconciliation ran 12m07s at 8 categories;
    # tablets take it to 11, and a killed run loses the scan report entirely.
    timeout-minutes: 30
    # Never two scans at once (external trigger + backup cron, or a manual run):
    # a second one waits for the first instead of double-alerting.
    concurrency:
      group: deal-scan
      cancel-in-progress: false
    permissions:
      actions: read     # the guard lists recent runs
      contents: read

    steps:
      - name: Skip the backup cron if a scan already ran
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          recent=$(gh run list -R "$GITHUB_REPOSITORY" -w scan.yml -L 20 \
            --json databaseId,createdAt,event,conclusion \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})
                       | select(.event == \"schedule\" or .event == \"workflow_dispatch\")
                       | select(.conclusion != \"cancelled\")
                       | select((now - (.createdAt | fromdateiso8601)) < 14400)] | length")
          echo "Scans started in the last 4h: $recent"
          if [ "$recent" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout code
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run deal scanner
        if: steps.guard.outputs.skip != 'true'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EBAY_MARKETPLACE: EBAY_IT
        run: python -m src.main

  keepalive:
    # GitHub disables cron workflows in public repos after 60 days without
    # repo activity. Re-enabling the workflow through the API resets that
    # timer, so the schedule survives long stretches with no commits.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scan.yml/enable"
